[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuro-symphony"
version = "0.1.0"
description = "Computational Neurophysiology, Spiking Cortical Microcircuits & Closed-Loop Deep Brain Stimulation (DBS) Dynamics in Python"
readme = "README.md"
authors = [
    { name = "ZengLLQ", email = "zengllq@example.com" }
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.15",
]
keywords = [
    "computational-neuroscience",
    "neural-engineering",
    "deep-brain-stimulation",
    "hodgkin-huxley",
    "spiking-neural-networks",
    "parkinsons-disease",
    "closed-loop-control",
    "biomedical-engineering",
    "python",
    "systems-biology"
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0"
]

[project.scripts]
neuro-symphony = "neuro_symphony.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
